<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація на спортивний захід</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        form { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .inline-group { display: flex; gap: 15px; }
        .inline-group label { font-weight: normal; margin-bottom: 0; }
        .checkbox-group label { font-weight: normal; display: inline-block; margin-left: 5px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button[type="submit"] { background-color: #007bff; color: white; }
        button[type="reset"] { background-color: #dc3545; color: white; margin-left: 10px; }
    </style>
</head>
<body>

    <h2>Реєстрація учасника на спортивний захід</h2>

    <form action="#" method="POST">
        
        <!-- Обов'язкове ім'я -->
        <div class="form-group">
            <label for="firstname">Ім'я *</label>
            <input type="text" id="firstname" name="firstname" required>
        </div>

        <!-- Обов'язкове прізвище -->
        <div class="form-group">
            <label for="lastname">Прізвище *</label>
            <input type="text" id="lastname" name="lastname" required>
        </div>

        <!-- Електронна пошта з правильним форматом -->
        <div class="form-group">
            <label for="email">Електронна пошта *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <!-- Номер телефону -->
        <div class="form-group">
            <label for="phone">Номер телефону</label>
            <input type="tel" id="phone" name="phone">
        </div>

        <!-- Вік від 12 до 80 років -->
        <div class="form-group">
            <label for="age">Вік *</label>
            <input type="number" id="age" name="age" min="12" max="80" required>
        </div>

        <!-- Обов'язкова дата участі -->
        <div class="form-group">
            <label for="event-date">Дата участі *</label>
            <input type="date" id="event-date" name="event-date" required>
        </div>

        <!-- Вибір однієї дистанції (обов'язково) -->
        <div class="form-group">
            <label>Виберіть дистанцію *</label>
            <div class="inline-group">
                <input type="radio" id="dist2" name="distance" value="2km" required>
                <label for="dist2">2 км</label>
                
                <input type="radio" id="dist5" name="distance" value="5km">
                <label for="dist5">5 км</label>
                
                <input type="radio" id="dist10" name="distance" value="10km">
                <label for="dist10">10 км</label>
            </div>
        </div>

        <!-- Додаткові можливості (Checkboxes) -->
        <div class="form-group">
            <label>Додаткові можливості:</label>
            <div class="checkbox-group">
                <input type="checkbox" id="opt1" name="options" value="tshirt">
                <label for="opt1">Отримати футболку</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="opt2" name="options" value="medal">
                <label for="opt2">Отримати медаль</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="opt3" name="options" value="news">
                <label for="opt3">Отримувати новини про наступні заходи</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="opt4" name="options" value="rating">
                <label for="opt4">Додати результати до загального рейтингу</label>
            </div>
        </div>

        <!-- Список категорій учасника (Select dropdown) -->
        <div class="form-group">
            <label for="category">Категорія учасника:</label>
            <select id="category" name="category">
                <option value="student-school">Учень</option>
                <option value="student-uni">Студент</option>
                <option value="adult">Дорослий</option>
                <option value="other">Інша категорія</option>
            </select>
        </div>

        <!-- Додаткова інформація (Максимум 250 символів) -->
        <div class="form-group">
            <label for="info">Додаткова інформація для організаторів</label>
            <textarea id="info" name="info" rows="3" maxlength="250" placeholder="Не більше 250 символів..."></textarea>
        </div>

        <!-- Кнопки -->
        <button type="submit">Зареєструватися</button>
        <button type="reset">Очистити форму</button>

    </form>

</body>
</html>
